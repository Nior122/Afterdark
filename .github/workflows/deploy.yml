name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly backstop: the bot's auto-rebuild trigger (docs/google-search-console.md)
  # fires on publishes, but this guarantees sitemap.xml and the prerendered video
  # pages refresh at least daily even when publishes came in through an older
  # Worker or nothing triggered a deploy.
  schedule:
    - cron: '15 5 * * *' # 05:15 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public origin the site is served from (no trailing slash) — used for
          # canonical URLs, Open Graph tags, sitemap.xml and robots.txt.
          # Falls back to https://nior122.github.io/Afterdark when unset.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # Optional public URL of the Telegram bot worker; set as a repo
          # variable to enable the bot feed + the mode switch
          # (docs/telegram-bot-setup.md).
          VITE_TELEGRAM_FEED_URL: ${{ vars.VITE_TELEGRAM_FEED_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

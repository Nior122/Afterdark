name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public origin the site is served from (no trailing slash), e.g.
          # https://nior122.github.io/Faceverify — used for canonical URLs,
          # Open Graph tags, sitemap.xml and robots.txt.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # Optional public URL of the Telegram bot worker; set as a repo
          # variable to enable the bot feed and to prerender bot videos
          # (docs/telegram-bot-setup.md).
          VITE_TELEGRAM_FEED_URL: ${{ vars.VITE_TELEGRAM_FEED_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public origin the site is served from (no trailing slash), e.g.
          # https://nior122.github.io/Faceverify — used for canonical URLs,
          # Open Graph tags, sitemap.xml and robots.txt.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # Optional public URL of the Telegram bot worker; set as a repo
          # variable to enable the bot feed and to prerender bot videos
          # (docs/telegram-bot-setup.md).
          VITE_TELEGRAM_FEED_URL: ${{ vars.VITE_TELEGRAM_FEED_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Crawlers must get a 200 for every sitemap URL and a noindex root, so
      # check the live deployment instead of assuming the host behaves. Pages
      # can take a minute to propagate, hence the retries.
      - name: Smoke-test the deployed site
        env:
          SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          set -uo pipefail
          BASE="${SITE_URL:-https://nior122.github.io/Faceverify}"
          BASE="${BASE%/}"
          echo "Checking $BASE"
          fail=0

          # Wait for a URL to answer 200 (Pages propagation), then echo the code.
          wait_for_200() {
            local url="$1" code="000"
            for _ in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$code"
          }

          root=$(wait_for_200 "$BASE/")
          echo "root: $root"
          [ "$root" = "200" ] || fail=1

          if ! curl -sf "$BASE/" | grep -q 'name="robots" content="noindex'; then
            echo "root is not noindex"
            fail=1
          fi

          if ! curl -sf "$BASE/robots.txt" | grep -q "Sitemap: $BASE/sitemap.xml"; then
            echo "robots.txt does not point at the sitemap"
            fail=1
          fi

          if curl -sf "$BASE/sitemap.xml" -o sitemap.xml; then
            while read -r loc; do
              code=$(wait_for_200 "$loc")
              echo "$code $loc"
              [ "$code" = "200" ] || fail=1
            done < <(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's|</\?loc>||g')
          else
            echo "sitemap.xml is not reachable"
            fail=1
          fi

          if [ "$fail" != "0" ]; then
            echo "::error::Live site checks failed"
            exit 1
          fi
          echo "All live checks passed"

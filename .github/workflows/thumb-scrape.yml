name: Thumb scrape (temporary)

on:
  push:
    branches: [arena/d1c199b7-faceverify]
    paths: ['.thumb-request']

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Telegram video thumbnail URLs for leakedvideospage/2269
        run: |
          python3 - <<'PY' > thumb-result.txt 2>&1
          import re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          def probe(url):
              try:
                  req = urllib.request.Request(url, headers=UA, method="GET")
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                  dims = "?"
                  if data[:2] == b"\xff\xd8":
                      i = 2
                      while i < len(data) - 9:
                          if data[i] != 0xFF:
                              i += 1
                              continue
                          marker = data[i + 1]
                          if marker in (0xC0, 0xC1, 0xC2):
                              h = int.from_bytes(data[i + 5:i + 7], "big")
                              w = int.from_bytes(data[i + 7:i + 9], "big")
                              dims = f"{w}x{h}"
                              break
                          length = int.from_bytes(data[i + 2:i + 4], "big")
                          i += 2 + length
                  print(f"PROBE {dims} {len(data)}B {url}")
              except Exception as e:
                  print(f"PROBE FAILED {e} {url}")

          pages = {
              "embed": "https://t.me/leakedvideospage/2269?embed=1&userpic=false&single=1&dark=1",
              "post": "https://t.me/leakedvideospage/2269",
              "channel": "https://t.me/s/leakedvideospage?before=2270",
          }
          candidates = []
          for name, url in pages.items():
              print(f"===== {name} {url}")
              try:
                  html = fetch(url)
              except Exception as e:
                  print("FETCH FAILED", e)
                  continue
              print("bytes", len(html))
              for m in re.finditer(r'property="og:image" content="([^"]+)"', html):
                  print("OGIMAGE", m.group(1)); candidates.append(m.group(1))
              for m in re.finditer(r'poster="([^"]+)"', html):
                  print("POSTER", m.group(1)); candidates.append(m.group(1))
              for m in re.finditer(r"tgme_widget_message_video_thumb[^>]*?url\(&#39;([^&]+)&#39;\)", html):
                  print("VIDEOTHUMB", m.group(1)); candidates.append(m.group(1))
              for m in re.finditer(r"tgme_widget_message_video_thumb[^>]*?url\('([^']+)'\)", html):
                  print("VIDEOTHUMB", m.group(1)); candidates.append(m.group(1))
              block = re.search(r'data-post="leakedvideospage/2269".*?(?=data-post="|$)', html, re.S)
              if block:
                  seg = block.group(0)
                  for m in re.finditer(r"url\(&#39;([^&]+)&#39;\)", seg):
                      print("BLOCK2269_BG", m.group(1)); candidates.append(m.group(1))
                  for m in re.finditer(r"url\('([^']+)'\)", seg):
                      print("BLOCK2269_BG", m.group(1)); candidates.append(m.group(1))
                  for m in re.finditer(r'<img[^>]+src="([^"]+)"', seg):
                      print("BLOCK2269_IMG", m.group(1))
              for m in re.finditer(r"background-image:url\(([^)]+)\)", html):
                  v = m.group(1).strip("'\"")
                  if "telesco" in v:
                      print("ANYBG", v)

          print("===== probing unique image candidates")
          seen = set()
          for c in candidates:
              c = c.replace("&amp;", "&")
              if c not in seen and "telesco" in c:
                  seen.add(c)
                  probe(c)
          PY
          cat thumb-result.txt

      - name: Commit result back to the branch
        run: |
          git config user.name "thumb-scrape"
          git config user.email "thumb-scrape@users.noreply.github.com"
          git add thumb-result.txt
          git commit -m "chore(temp): telegram thumbnail scrape result" || exit 0
          git push origin HEAD:arena/d1c199b7-faceverify

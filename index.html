<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1"
    />

    <title>Faceverify — 3D Digital Twin</title>
    <meta
      name="description"
      content="Turn a selfie into a realistic rigged 3D head, animate it by hand, or drive it live with your camera. Runs on your device."
    />

    <!-- Dark chrome, so the app does not flash white while the 3D scene boots. -->
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS: standalone launch, translucent status bar over the canvas. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Faceverify" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Faceverify — 3D Digital Twin" />
    <meta
      property="og:description"
      content="A selfie becomes a rigged 3D head you can pose by hand or drive live with your camera."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Shown until the bundle executes, and permanently if JavaScript is off. It is
      inline so it appears in the very first paint.
    -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__mark"></div>
      <p class="boot-splash__label">Faceverify</p>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          padding: 32px;
          background: #0b0d12;
          color: #e2e8f0;
          font: 15px/1.5 system-ui, sans-serif;
          text-align: center;
        "
      >
        <p>
          Faceverify renders a 3D head, which needs JavaScript and WebGL. Please enable
          JavaScript, or open this page in a modern browser such as Chrome or Safari.
        </p>
      </div>
    </noscript>

    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        grid-auto-flow: row;
        background: radial-gradient(120% 90% at 50% 20%, #1b1f2a 0%, #0b0d12 62%);
        color: #94a3b8;
        font: 500 13px/1 system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: opacity 320ms ease-out;
        z-index: 100;
      }
      #boot-splash[hidden] {
        display: none;
      }
      #boot-splash.is-leaving {
        opacity: 0;
      }
      .boot-splash__mark {
        width: 46px;
        height: 46px;
        border-radius: 16px;
        background: linear-gradient(150deg, #f0715f 0%, #7c3aed 100%);
        box-shadow: 0 8px 30px rgb(124 58 237 / 0.35);
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.75;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark {
          animation: none;
        }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

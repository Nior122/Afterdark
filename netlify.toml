[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No SPA catch-all rewrite: every video page is prerendered as
# v/<id>/index.html, and unknown paths fall through to Netlify's
# automatic 404.html handling (dist/404.html), which keeps "/" out of
# search results. Set VITE_SITE_URL (and optionally
# VITE_TELEGRAM_FEED_URL) in Site settings → Environment variables.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
